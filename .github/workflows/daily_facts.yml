name: Daily Facts Short

on:
  schedule:
    # Runs at 2:00, 10:00, and 18:00 UTC (3 times a day)
    # This translates roughly to 7:30 AM, 3:30 PM, and 11:30 PM IST
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Specific topic to generate (leave blank for random)"
        required: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Script
      env:
        # Core API Keys
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        DEAPI_TOKEN: ${{ secrets.DEAPI_TOKEN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        
        # YouTube Secrets
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET_VALUE: ${{ secrets.YT_CLIENT_SECRET_VALUE }}
        YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
        YT_REFRESH_TOKEN_TE: ${{ secrets.YT_REFRESH_TOKEN_TE }}
        
        # FishAudio TTS Secrets
        FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        
        # Notification Secrets
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      run: |
        TOPIC="${{ github.event.inputs.topic }}"
        if [ -n "$TOPIC" ]; then
          python scripts/run_short.py --channel facts --topic "$TOPIC" --upload --privacy public
        else
          python scripts/run_short.py --channel facts --upload --privacy public
        fi
